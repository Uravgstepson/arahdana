<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00C878" />
    <title>ArahDana Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #062d20;
        color: #ffffff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
        background:
          linear-gradient(180deg, rgba(6, 45, 32, 0.92), rgba(3, 20, 15, 1)),
          #062d20;
      }

      main {
        display: grid;
        width: min(100%, 360px);
        place-items: center;
        text-align: center;
      }

      .mark {
        display: grid;
        width: 116px;
        height: 116px;
        place-items: center;
        overflow: hidden;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow:
          0 0 72px rgba(0, 200, 120, 0.34),
          0 24px 72px rgba(0, 0, 0, 0.34);
      }

      .mark img {
        display: block;
        width: 78%;
        height: 78%;
        object-fit: contain;
      }

      h1 {
        margin: 26px 0 8px;
        font-size: 24px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 14px;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        border-radius: 999px;
        background: #00c878;
        color: #062d20;
        padding: 0 18px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <img src="/icons/arahdana-logo.png" alt="ArahDana" />
      </div>
      <h1>ArahDana sedang offline</h1>
      <p>Koneksi belum tersedia. Coba buka ulang saat jaringan kembali stabil.</p>
      <a href="/">Buka ulang</a>
    </main>
  </body>
</html>
