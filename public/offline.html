<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf3f7" />
    <title>ArahDana Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f8f5;
        color: #1c1917;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid #d6d3d1;
        border-radius: 12px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 12px 28px rgba(28, 25, 23, 0.08);
      }

      .mark {
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
        border-radius: 14px;
        background: #047857;
        color: #ffffff;
        font-size: 20px;
        font-weight: 800;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #57534e;
        font-size: 15px;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 22px;
        border-radius: 10px;
        background: #047857;
        color: #ffffff;
        padding: 11px 16px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">AD</div>
      <h1>ArahDana sedang offline</h1>
      <p>
        Koneksi internet tidak tersedia. Data yang sudah tersimpan di browser tetap aman, dan halaman
        yang pernah dibuka dapat tersedia kembali setelah koneksi pulih.
      </p>
      <a href="/dashboard">Coba buka ulang</a>
    </main>
  </body>
</html>
